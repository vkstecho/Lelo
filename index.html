<script>
  // Force HTTPS. Over plain HTTP, some mobile carriers inject their own
  // scripts into the page — which is what causes errors like "Cannot use
  // import statement outside a module" that have nothing to do with this
  // app's own code. HTTPS also blocks that kind of injection entirely.
  if(location.protocol === "http:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
    location.replace("https://" + location.host + location.pathname + location.search);
  }
</script>

<script>
  // Plain, non-React watchdog: if the real app hasn't mounted within 8s
  // (blocked script, no internet, ad-blocker, syntax error, etc.), replace
  // the "Loading…" placeholder with an actual diagnostic instead of leaving
  // the phone stuck on that screen forever with no explanation.
  window.__leloBootError = null;
  window.addEventListener("error", function(e){
    window.__leloBootError = (e.message || "Unknown script error") +
      (e.filename ? " — " + e.filename.split("/").pop() + ":" + e.lineno : "");
  });
  window.addEventListener("unhandledrejection", function(e){
    window.__leloBootError = "Promise error: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
  if(location.protocol === "http:"){
    window.__leloBootError = "This page loaded over an insecure connection (http, not https). On mobile data, your carrier can inject broken scripts into http pages — that's almost always the real cause of errors here. Ask your host to enable HTTPS/SSL for this domain.";
  }
  setTimeout(function(){
    if(window.__leloMounted) return;
    var root = document.getElementById("root");
    if(!root) return;
    root.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif;color:#2B2620;padding:28px;text-align:center;gap:10px;">' +
      '<div style="font-size:40px;">⚠️</div>' +
      '<div style="font-weight:700;font-size:17px;">The app is taking too long to load</div>' +
      '<div style="color:#786F62;font-size:14px;max-width:320px;">This usually means a script got blocked (no internet, an ad-blocker, or a firewall) or the page failed to build.</div>' +
      (window.__leloBootError ? '<div style="font-size:12px;color:#C0392B;word-break:break-word;max-width:320px;">' + window.__leloBootError + '</div>' : '') +
      '<button onclick="window.location.reload()" style="margin-top:10px;background:#1F6E3D;color:#fff;border:none;border-radius:12px;padding:12px 22px;font-weight:700;font-size:15px;">Reload</button>' +
      '</div>';
  }, 8000);
</script>

/* =========================================================

function fmtDate(d){
  if(!d) return "-";
  const date = d.toDate ? d.toDate() : new Date(d);
  return date.toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
}
function daysLeft(expiry){
  if(!expiry) return 0;
  const date = expiry.toDate ? expiry.toDate() : new Date(expiry);
  return Math.ceil((date.getTime() - Date.now()) / 86400000);
}
function addDaysToDate(baseDate, days){
  const d = baseDate ? new Date(baseDate) : new Date();
  d.setDate(d.getDate() + days);
  return d;
}
function rupee(n){ return "\u20B9" + Number(n || 0).toFixed(0); }
function cx(...a){ return a.filter(Boolean).join(" "); }

/* =========================================================

function useToast(){
  const [msg, setMsg] = useState(null);
  const show = useCallback((m) => {
    setMsg(m);
    setTimeout(() => setMsg(null), 2600);
  }, []);
  const node = msg ? <div className="toast">{msg}</div> : null;
  return [node, show];
}

/* =========================================================
   LOGIN FLOW (Firebase Phone Auth OTP)
   ========================================================= */
function humanizeAuthError(e){
  const code = e && e.code;
  const map = {
    "auth/invalid-app-credential": "This domain isn't authorized for OTP login yet. Add it under Firebase Console → Authentication → Settings → Authorized domains.",
    "auth/argument-error": "OTP login isn't set up for this domain yet. Add it under Firebase Console → Authentication → Settings → Authorized domains.",
    "auth/too-many-requests": "Too many attempts. Please wait a bit and try again.",
    "auth/quota-exceeded": "SMS quota reached for today. Please try again later.",
    "auth/invalid-phone-number": "That doesn't look like a valid mobile number.",
    "auth/network-request-failed": "Network error. Check your connection and try again.",
    "auth/operation-not-allowed": "Phone sign-in isn't enabled yet. Enable it in Firebase Console → Authentication → Sign-in method.",
  };
  return map[code] || (e && e.message) || "Could not send OTP. Please try again.";
}

function LoginScreen({ onLoggedIn }){
  const [step, setStep] = useState("phone"); // phone | otp
  const [phone, setPhone] = useState("");
  const [otp, setOtp] = useState(["","","","","",""]);
  const [confirmation, setConfirmation] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  // The reCAPTCHA verifier is created lazily, right when the person taps
  // "Send OTP" — not on page load. Creating it on load is what causes a
  // blank white screen if the domain isn't authorized yet or the reCAPTCHA
  // script is blocked, since it can throw before anything is on screen.
  const getRecaptcha = () => {
    if(window.__leloRecaptcha){
      try{ window.__leloRecaptcha.clear(); }catch(e){}
      window.__leloRecaptcha = null;
    }
    window.__leloRecaptcha = new firebase.auth.RecaptchaVerifier("recaptcha-container", {
      size: "invisible",
    });
    return window.__leloRecaptcha;
  };

  const sendOtp = async () => {
    setError("");
    if(!/^[6-9]\d{9}$/.test(phone)){
      setError("Enter a valid 10-digit mobile number.");
      return;
    }
    setLoading(true);
    try{
      const verifier = getRecaptcha();
      const result = await auth.signInWithPhoneNumber("+91" + phone, verifier);
      setConfirmation(result);
      setStep("otp");
    }catch(e){
      console.error(e);
      setError(humanizeAuthError(e));
    }
    setLoading(false);
  };

  const verifyOtp = async () => {
    setError("");
    const code = otp.join("");
    if(code.length !== 6){ setError("Enter the 6-digit code."); return; }
    setLoading(true);
    try{
      await confirmation.confirm(code);
      onLoggedIn();
    }catch(e){
      console.error(e);
      setError("Incorrect code. Please try again.");
    }
    setLoading(false);
  };

  const setOtpDigit = (i, v) => {
    if(!/^\d?$/.test(v)) return;
    const next = [...otp]; next[i] = v; setOtp(next);
    if(v && i < 5) document.getElementById("otp-" + (i+1))?.focus();
  };

  return (
    <div className="center-screen">
      <img src="lelo-logo.jpg" className="login-logo" alt="Lelo Sab Kuchh" />
      <div className="login-sub" style={{marginBottom: 24}}>Food &amp; grocery, delivered to your door.</div>

      {step === "phone" && (
        <div style={{width:"100%"}}>
          <div className="field">
            <label className="field-label">Mobile number</label>
            <div className="phone-input-wrap">
              <div className="phone-prefix">+91</div>
              <input type="tel" maxLength="10" placeholder="98765 43210"
                value={phone} onChange={e => setPhone(e.target.value.replace(/\D/g,""))} />
            </div>
          </div>
          {error && <div className="error-text">{error}</div>}
          <button className="btn btn-orange" style={{marginTop:10}} disabled={loading} onClick={sendOtp}>
            {loading ? "Sending..." : "Send OTP"}
          </button>
        </div>
      )}

      {step === "otp" && (
        <div style={{width:"100%"}}>
          <div className="muted">Code sent to +91 {phone}</div>
          <div className="otp-boxes">
            {otp.map((d,i) => (
              <input key={i} id={"otp-"+i} type="text" inputMode="numeric" maxLength="1"
                value={d} onChange={e => setOtpDigit(i, e.target.value)} />
            ))}
          </div>
          {error && <div className="error-text">{error}</div>}
          <button className="btn btn-primary" disabled={loading} onClick={verifyOtp}>
            {loading ? "Verifying..." : "Verify & Continue"}
          </button>
          <button className="btn" style={{background:"transparent", color:"var(--ink-soft)", marginTop:6}}
            onClick={() => { setStep("phone"); setOtp(["","","","","",""]); }}>
            Change number
          </button>
        </div>
      )}

      <div id="recaptcha-container"></div>
    </div>
  );
}

      setDeliveryPerson(snap.exists ? snap.data() : null);
    });
    const unsub4 = db.collection("orders").where("phone", "==", phone)
      .orderBy("createdAt", "desc").onSnapshot(snap => {
        setMyOrders(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      }, err => console.error(err));
    return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
  }, [phone]);

  const cartCount = Object.values(cart).reduce((a,b) => a+b, 0);
  const cartLines = useMemo(() => {
    return Object.entries(cart).filter(([,q]) => q > 0).map(([id,q]) => {
      const item = items.find(i => i.id === id);
      return item ? { ...item, qty: q } : null;
    }).filter(Boolean);
  }, [cart, items]);
  const cartTotal = cartLines.reduce((sum, l) => sum + l.price * l.qty, 0);

  const setQty = (id, qty) => setCart(c => ({ ...c, [id]: Math.max(0, qty) }));

  const confirmOrder = () => {
    if(cartLines.length === 0) return;
    setPlacing(true);
    const finalize = (location) => {
      db.collection("orders").add({
        phone,
        items: cartLines.map(l => ({ itemId: l.id, name: l.name, price: l.price, qty: l.qty })),
        total: cartTotal,
        status: "new",
        location: location || null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      }).then(() => {
        setCart({});
        setPlacing(false);
        setTab("orders");
        showToast("Order placed! The store has been notified.");
      }).catch(e => { console.error(e); setPlacing(false); showToast("Could not place order. Try again."); });
    };
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos => finalize({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        () => finalize(null),
        { timeout: 6000 }
      );
    } else {
      finalize(null);
    }
  };

  const grouped = categories.map(cat => ({
    ...cat,
    items: items.filter(i => i.categoryId === cat.id),
  })).filter(c => c.items.length > 0);
  const uncategorized = items.filter(i => !categories.some(c => c.id === i.categoryId));

  const statusLabel = { new:"Order received", preparing:"Preparing", out:"Out for delivery", delivered:"Delivered" };
  const statusBadge = { new:"badge-orange", preparing:"badge-orange", out:"badge-green", delivered:"badge-green" };

  return (
    <React.Fragment>
      <div className="topbar">
        <img src="lelo-logo.jpg" alt="logo" />
        <div>
          <div className="brand">Lelo <span>Sab Kuchh</span></div>
          <div className="tag">+91 {phone}</div>
        </div>
        <div className="spacer"></div>
        <button className="icon-btn" onClick={onLogout}>Log out</button>
      </div>

      <div className="screen">
        {tab === "menu" && (
          items.length === 0 ? (
            <div className="empty-state"><span className="emoji">🍽️</span>Menu is being set up.<br/>Please check back soon.</div>
          ) : (
            <React.Fragment>
              {grouped.map(cat => (
                <div key={cat.id}>
                  <div className="category-title">{cat.name}</div>
                  {cat.items.map(item => (
                    <MenuItemRow key={item.id} item={item} qty={cart[item.id] || 0} setQty={q => setQty(item.id, q)} />
                  ))}
                </div>
              ))}
              {uncategorized.length > 0 && (
                <div>
                  <div className="category-title">Other items</div>
                  {uncategorized.map(item => (
                    <MenuItemRow key={item.id} item={item} qty={cart[item.id] || 0} setQty={q => setQty(item.id, q)} />
                  ))}
                </div>
              )}
            </React.Fragment>
          )
        )}

        {tab === "cart" && (
          cartLines.length === 0 ? (
            <div className="empty-state"><span className="emoji">🛒</span>Your cart is empty.<br/>Add items from the menu.</div>
          ) : (
            <div className="card">
              {cartLines.map(l => (
                <div className="cart-row" key={l.id}>
                  <div className="item-icon" style={{width:38,height:38,fontSize:19}}>{l.icon || "🍽️"}</div>
                  <div className="item-info">
                    <div className="item-name">{l.name}</div>
                    <div className="item-price">{rupee(l.price)} x {l.qty} = {rupee(l.price*l.qty)}</div>
                  </div>
                  <div className="stepper">
                    <button onClick={() => setQty(l.id, l.qty - 1)}>−</button>
                    <span>{l.qty}</span>
                    <button onClick={() => setQty(l.id, l.qty + 1)}>+</button>
                  </div>
                </div>
              ))}
            </div>
          )
        )}

        {tab === "contact" && (
          <div className="card" style={{textAlign:"center", padding:26}}>
            <div style={{fontSize:40}}>🛵</div>
            {deliveryPerson ? (
              <React.Fragment>
                <h3 style={{margin:"10px 0 2px"}}>{deliveryPerson.name || "Delivery partner"}</h3>
                <div className="muted" style={{marginBottom:18}}>+91 {deliveryPerson.phone}</div>
                <div className="row gap">
                  <a className="btn btn-primary" href={"tel:+91" + deliveryPerson.phone}>📞 Call</a>
                  <a className="btn btn-orange" href={"https://wa.me/91" + deliveryPerson.phone} target="_blank" rel="noreferrer">💬 WhatsApp</a>
                </div>
              </React.Fragment>
            ) : (
              <p className="muted">Delivery contact hasn't been set up yet.</p>
            )}
          </div>
        )}

        {tab === "orders" && (
          myOrders.length === 0 ? (
            <div className="empty-state"><span className="emoji">📦</span>You have no orders yet.</div>
          ) : (
            myOrders.map(o => (
              <div className="card" key={o.id} style={{marginBottom:12}}>
                <div className="row between">
                  <span className="muted">{o.createdAt ? fmtDate(o.createdAt) : "Just now"}</span>
                  <span className={cx("badge", statusBadge[o.status] || "badge-grey")}>{statusLabel[o.status] || o.status}</span>
                </div>
                <div className="divider"></div>
                {o.items.map((it,idx) => (
                  <div key={idx} className="row between" style={{fontSize:14, marginBottom:4}}>
                    <span>{it.name} x {it.qty}</span>
                    <span>{rupee(it.price * it.qty)}</span>
                  </div>
                ))}
                <div className="divider"></div>
                <div className="row between" style={{fontWeight:700}}>
                  <span>Total</span><span>{rupee(o.total)}</span>
                </div>
              </div>
            ))
          )
        )}
      </div>

      {tab === "cart" && cartLines.length > 0 && (
        <div className="cart-total-bar">
          <div>
            <div style={{fontSize:12, opacity:.85}}>{cartCount} item{cartCount>1?"s":""}</div>
            <div style={{fontWeight:700, fontSize:17}}>{rupee(cartTotal)}</div>
          </div>
          <button className="btn btn-orange" style={{width:"auto", padding:"11px 22px"}} disabled={placing} onClick={confirmOrder}>
            {placing ? "Placing..." : "Confirm order"}
          </button>
        </div>
      )}

      <div className="tabbar">
        <TabBtn active={tab==="menu"} onClick={() => setTab("menu")} icon="🍽️" label="Menu" />
        <TabBtn active={tab==="cart"} onClick={() => setTab("cart")} icon="🛒" label="Cart" count={cartCount} />
        <TabBtn active={tab==="orders"} onClick={() => setTab("orders")} icon="📦" label="Orders" />
        <TabBtn active={tab==="contact"} onClick={() => setTab("contact")} icon="🛵" label="Delivery" />

function AdminApp({ phone, onLogout, showToast }){
  const [tab, setTab] = useState("items");
  const [categories, setCategories] = useState([]);
  const [items, setItems] = useState([]);
  const [users, setUsers] = useState([]);
  const [orders, setOrders] = useState([]);
  const [deliveryPerson, setDeliveryPerson] = useState({ name:"", phone:"" });
  const prevNewCount = useRef(0);

  useEffect(() => {
    if("Notification" in window && Notification.permission === "default"){
      Notification.requestPermission();
    }
    const u1 = db.collection("categories").orderBy("name").onSnapshot(s => setCategories(s.docs.map(d => ({id:d.id, ...d.data()}))));
    const u2 = db.collection("items").onSnapshot(s => setItems(s.docs.map(d => ({id:d.id, ...d.data()}))));
    const u3 = db.collection("users").orderBy("createdAt", "desc").onSnapshot(s => setUsers(s.docs.map(d => ({id:d.id, ...d.data()}))));
    const u4 = db.collection("orders").orderBy("createdAt", "desc").limit(200).onSnapshot(s => {
      const list = s.docs.map(d => ({id:d.id, ...d.data()}));
      const newCount = list.filter(o => o.status === "new").length;
      if(newCount > prevNewCount.current){
        showToast("🔔 New order received!");
        if("Notification" in window && Notification.permission === "granted"){
          new Notification(APP_NAME, { body: "A new order has come in." });
        }
      }
      prevNewCount.current = newCount;
      setOrders(list);
    });
    const u5 = db.collection("settings").doc("deliveryPerson").onSnapshot(s => {
      if(s.exists) setDeliveryPerson(s.data());
    });
    return () => { u1(); u2(); u3(); u4(); u5(); };
  }, []);

  const newOrdersCount = orders.filter(o => o.status === "new").length;

  return (
    <React.Fragment>
      <div className="topbar admin-topbar">
        <img src="lelo-logo.jpg" alt="logo" />
        <div>
          <div className="brand">Admin console</div>
          <div className="tag">+91 {phone}</div>
        </div>
        <div className="spacer"></div>
        <button className="icon-btn" style={{color:"#fff"}} onClick={onLogout}>Log out</button>
      </div>

      <div className="admin-tabs">
        <div className={cx("admin-tab", tab==="items" && "active")} onClick={() => setTab("items")}>Items</div>
        <div className={cx("admin-tab", tab==="users" && "active")} onClick={() => setTab("users")}>Users</div>
        <div className={cx("admin-tab", tab==="orders" && "active")} onClick={() => setTab("orders")}>
          Orders{newOrdersCount > 0 ? " (" + newOrdersCount + ")" : ""}
        </div>
      </div>

      <div className="screen">
        {tab === "items" && <AdminItems categories={categories} items={items} deliveryPerson={deliveryPerson} showToast={showToast} />}
        {tab === "users" && <AdminUsers users={users} showToast={showToast} />}
        {tab === "orders" && <AdminOrders orders={orders} />}
      </div>
    </React.Fragment>
  );
}

    db.collection("categories").add({ name: catName.trim() });

    showToast("Category added.");
  };

    db.collection("settings").doc("deliveryPerson").set({ name: dp.name || "", phone: (dp.phone||"").replace(/\D/g,"") });

  return (

          <div style={{flex:1}}>

          </div>

            <label className="field-label">Category</label>
            <select value={form.categoryId} onChange={e => setForm({...form, categoryId:e.target.value})}>

        </div>

      <h3>Current menu</h3>

        <div key={cat.id} style={{marginBottom:14}}>
          <div className="row between" style={{marginBottom:6}}>
            <div className="category-title" style={{margin:0}}>{cat.name}</div>
            <button className="btn-sm btn-danger btn" onClick={() => deleteCategory(cat.id)}>Delete</button>
          </div>

        <div className="field">
          <label className="field-label">Mobile number</label>

        </div>
        <button className="btn btn-primary" onClick={saveDeliveryPerson}>Save</button>

function AdminUsers({ users, showToast }){
  const toggleBlock = (u) => db.collection("users").doc(u.id).update({ blocked: !u.blocked });
  const adjustDays = (u, delta) => {
    const base = u.expiryDate ? (u.expiryDate.toDate ? u.expiryDate.toDate() : new Date(u.expiryDate)) : new Date();
    const newDate = addDaysToDate(base, delta);
    db.collection("users").doc(u.id).update({ expiryDate: newDate });
    showToast((delta > 0 ? "Extended" : "Reduced") + " validity by " + Math.abs(delta) + " day(s).");
  };
  return (
    users.length === 0 ? (
      <div className="empty-state"><span className="emoji">👥</span>No registered users yet.</div>
    ) : (
      users.map(u => {
        const left = daysLeft(u.expiryDate);
        const expired = left <= 0;
        return (
          <div className="card" key={u.id} style={{marginBottom:12}}>
            <div className="row between">
              <div>
                <div style={{fontWeight:700}}>+91 {u.phone.replace("+91","")}</div>
                <div className="muted">Joined {fmtDate(u.createdAt)}</div>
              </div>
              <button className={cx("toggle", u.blocked && "on")} onClick={() => toggleBlock(u)} title="Block user"><span className="knob"></span></button>
            </div>
            <div className="row between" style={{marginTop:10}}>
              <span className={cx("badge", u.blocked ? "badge-red" : expired ? "badge-red" : "badge-green")}>
                {u.blocked ? "Blocked" : expired ? "Expired" : left + " day(s) left"}
              </span>
              <span className="muted">Valid till {fmtDate(u.expiryDate)}</span>
            </div>
            <div className="row gap" style={{marginTop:10}}>
              <button className="btn btn-sm btn-outline" onClick={() => adjustDays(u, -7)}>−7 days</button>
              <button className="btn btn-sm btn-outline" onClick={() => adjustDays(u, 7)}>+7 days</button>
              <button className="btn btn-sm btn-primary" onClick={() => adjustDays(u, 30)}>+30 days</button>
            </div>
          </div>
        );
      })
    )
  );
}

/* =========================================================
   ERROR BOUNDARY — shows a message instead of a blank white page
   ========================================================= */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){ console.error("Lelo Sab Kuchh crashed:", error, info); }
  render(){
    if(this.state.error){
      return (
        <div className="shell">
          <div className="center-screen">
            <div style={{fontSize:44}}>⚠️</div>
            <h2 style={{margin:"14px 0 6px"}}>Something went wrong</h2>
            <p className="muted" style={{wordBreak:"break-word"}}>{String(this.state.error.message || this.state.error)}</p>
            <button className="btn btn-primary" style={{marginTop:16,width:"auto",padding:"10px 24px"}}
              onClick={() => window.location.reload()}>Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* =========================================================
   ROOT APP — auth + routing
   ========================================================= */
function App(){
  const [authUser, setAuthUser] = useState(undefined); // undefined = loading, null = logged out
  const [userDoc, setUserDoc] = useState(undefined);
  const [toastNode, showToast] = useToast();

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setAuthUser(u));
    return unsub;
  }, []);

  useEffect(() => {
    if(!authUser) { setUserDoc(null); return; }
    if(ADMIN_NUMBERS.includes(authUser.phoneNumber)) { setUserDoc(null); return; }
    const ref = db.collection("users").doc(authUser.phoneNumber);
    const unsub = ref.onSnapshot(async snap => {
      if(!snap.exists){
        const expiry = addDaysToDate(new Date(), DEFAULT_VALIDITY_DAYS);
        await ref.set({
          phone: authUser.phoneNumber,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          expiryDate: expiry,
          blocked: false,
        });
      } else {
        setUserDoc(snap.data());
      }
    });
    return unsub;
  }, [authUser]);

  const logout = () => auth.signOut();

  let body;
  if(authUser === undefined){
    body = <div className="center-screen"><img src="lelo-logo.jpg" className="login-logo" alt="" /></div>;
  } else if(authUser === null){
    body = <LoginScreen onLoggedIn={() => {}} />;
  } else if(ADMIN_NUMBERS.includes(authUser.phoneNumber)){
    body = <AdminApp phone={authUser.phoneNumber.replace("+91","")} onLogout={logout} showToast={showToast} />;
  } else if(userDoc === undefined){
    body = <div className="center-screen"><img src="lelo-logo.jpg" className="login-logo" alt="" /></div>;
  } else if(userDoc && userDoc.blocked){
    body = <StatusScreen emoji="🚫" title="Account blocked" sub="Your account has been blocked. Please contact the store for help." onLogout={logout} />;
  } else if(userDoc && daysLeft(userDoc.expiryDate) <= 0){
    body = <StatusScreen emoji="⏳" title="Login expired" sub="Your app access has expired. Please contact the store to renew." onLogout={logout} />;
  } else if(userDoc){
    body = <UserApp phone={authUser.phoneNumber.replace("+91","")} userDoc={userDoc} onLogout={logout} showToast={showToast} />;
  } else {
    body = <div className="center-screen"><img src="lelo-logo.jpg" className="login-logo" alt="" /></div>;
  }

  return <div className="shell">{toastNode}{body}</div>;
}

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("Service worker failed:", err));
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
window.__leloMounted = true;
</script>
</body>
</html>
